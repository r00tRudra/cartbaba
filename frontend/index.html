<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CartBaba 🛒</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="awning">
      <div class="awning__stripes"></div>
      <div class="awning__content">
        <h1>🛒 CartBaba</h1>
        <p class="tagline">Your neighbourhood search, now online</p>
      </div>
    </header>

    <main>
      <div class="search-box">
        <input
          id="searchInput"
          placeholder="Try “shoes under 5000”"
          autocomplete="off"
        />
        <button onclick="searchProducts()">Search</button>
      </div>

      <div id="loading" class="loading" aria-live="polite"></div>

      <div id="ai-output"></div>

      <div id="results"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
